<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo der Präpositionen</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f3ee;color:#222;margin:0;padding:18px}main{max-width:900px;margin:auto}.panel{background:white;border:1px solid #ddd5c9;border-radius:14px;padding:18px;margin:15px 0}button{cursor:pointer;border:1px solid #bbb;border-radius:10px;padding:12px;background:#eeeae3;font-weight:700}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tile{min-height:92px;background:#faf8f4;border:2px solid #ded8ce;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center}.tile.ok{background:#e1f5e9;border-color:#16804a}.tile.bad{background:#ffe5e5;border-color:#bd2323}.tile small{font-size:11px}.call{font-size:36px;font-weight:800;margin:12px 0}.muted{color:#666}.bar{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:#16804a;width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.tile{min-height:95px;font-size:13px}body{padding:9px}}</style></head><body><main><p><a href="./">← Deutsch Tabellen</a></p><h1>Bingo der Präpositionen</h1><p class="muted">48 combinaciones · 12 verbos por cartón</p><div class="panel"><div class="top"><button id="new">Nuevo cartón</button><b id="count"></b></div><div class="call" id="call">¿Preparado?</div><p id="case" class="muted">Saca la primera preposición.</p><button id="next">Sacar preposición</button><div class="bar"><span id="bar"></span></div><p id="msg" aria-live="polite"></p><p class="muted">Marca todos los verbos que llevan la preposición y el caso indicados. Después pasa a la siguiente ronda.</p></div><div class="panel"><div class="grid" id="grid"></div></div></main><script>
const bank="warten|auf|A|esperar;sich freuen|auf|A|esperar con ilusión;achten|auf|A|prestar atención;hoffen|auf|A|tener esperanza;sich verlassen|auf|A|confiar;denken|an|A|pensar;sich erinnern|an|A|recordar;glauben|an|A|creer;teilnehmen|an|D|participar;arbeiten|an|D|trabajar;zweifeln|an|D|dudar;sprechen|über|A|hablar;sich ärgern|über|A|enfadarse;sich informieren|über|A|informarse;nachdenken|über|A|reflexionar;diskutieren|über|A|discutir;sich interessieren|für|A|interesarse;sich entscheiden|für|A|decidirse;sich bedanken|für|A|agradecer;sorgen|für|A|ocuparse;sich kümmern|um|A|ocuparse;sich bewerben|um|A|postularse;bitten|um|A|pedir;sich bemühen|um|A|esforzarse;abhängen|von|D|depender;träumen|von|D|soñar;erzählen|von|D|contar;profitieren|von|D|beneficiarse;sich beschäftigen|mit|D|dedicarse;anfangen|mit|D|empezar;rechnen|mit|D|contar con;sich treffen|mit|D|reunirse;fragen|nach|D|preguntar;suchen|nach|D|buscar;sich erkundigen|nach|D|informarse;bestehen|aus|D|componerse;leiden|unter|D|sufrir;warnen|vor|D|advertir;Angst haben|vor|D|tener miedo;sich schützen|vor|D|protegerse;sich gewöhnen|an|A|acostumbrarse;sich vorbereiten|auf|A|prepararse;sich beschweren|über|A|quejarse;sich konzentrieren|auf|A|concentrarse;sich entschuldigen|für|A|disculparse;gehören|zu|D|pertenecer;passen|zu|D|encajar;führen|zu|D|conducir".split(';').map(s=>s.split('|'));
const $=id=>document.getElementById(id);let card=[],remaining=[],active=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){let groups={};bank.forEach(v=>(groups[v[1]+'|'+v[2]]??=[]).push(v));let chosen=shuffle(Object.keys(groups)).slice(0,12).map(k=>shuffle([...groups[k]])[0]);let other=shuffle(bank.filter(v=>!chosen.includes(v)));while(chosen.length<12)chosen.push(other.pop());card=shuffle(chosen).map(v=>({v,done:false}));remaining=shuffle([...new Set(card.map(o=>o.v[1]+'|'+o.v[2]))]);active=null;$('call').textContent='¿Preparado?';$('case').textContent='Saca la primera preposición.';$('next').textContent='Sacar preposición';$('msg').textContent='';render()}
function render(){let n=card.filter(o=>o.done).length;$('count').textContent=n+' / 12';$('bar').style.width=n/12*100+'%';$('grid').replaceChildren();card.forEach((o,i)=>{let b=document.createElement('button');b.className='tile'+(o.done?' ok':'');b.disabled=o.done||!active;b.textContent=o.v[0];if(o.done){let small=document.createElement('small');small.textContent=o.v[1]+' + '+(o.v[2]==='A'?'Akkusativ':'Dativ');b.append(small)}b.onclick=()=>mark(i,b);$('grid').append(b)})}
function draw(){if(active&&card.some(o=>!o.done&&o.v[1]+'|'+o.v[2]===active)){$('msg').textContent='Todavía quedan verbos con esta combinación.';return}if(!remaining.length){$('msg').textContent='¡Bingo!';return}active=remaining.pop();let [p,c]=active.split('|');$('call').textContent=p;$('case').textContent=c==='A'?'Akkusativ':'Dativ';$('next').textContent='Siguiente preposición';$('msg').textContent='Selecciona los verbos correspondientes.';render()}
function mark(i,b){let o=card[i];if(o.v[1]+'|'+o.v[2]!==active){b.classList.add('bad');$('msg').textContent='No corresponde. Prueba otro verbo.';setTimeout(()=>b.classList.remove('bad'),650);return}o.done=true;render();let left=card.filter(x=>!x.done&&x.v[1]+'|'+x.v[2]===active).length;$('msg').textContent=card.every(x=>x.done)?'¡Bingo! Completaste el cartón.':left?'¡Correcto! Faltan '+left+' con esta combinación.':'¡Bien! Puedes sacar la siguiente preposición.'}
$('new').onclick=reset;$('next').onclick=draw;reset();
</script></body></html>
